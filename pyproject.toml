[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-project"
version = "0.1.0"
description = "LiteLLM gateway + QLoRA skill detection (ESCO base, custom skills as LoRA)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
gateway = ["litellm>=1.50"]
train = ["torch>=2.7", "transformers>=5.19", "peft>=0.21", "datasets>=2.19", "accelerate>=1.15", "safetensors>=0.8", "huggingface_hub>=2.2"]
serve = ["fastapi>=0.115", "uvicorn>=0.32", "prometheus_client>=0.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
