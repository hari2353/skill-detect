# QLoRA recipe tuned for RTX 3070 Laptop 8GB (16GB system RAM).
# Default: Gemma 3-4B-it — best strict-JSON obedience in this VRAM class.
# Unsloth is effectively mandatory at 4B on 8GB (batch 1 + grad-ckpt below).
base_model: google/gemma-3-4b-it   # alt: Qwen/Qwen2.5-3B-Instruct (lighter), meta-llama/Llama-3.2-3B-Instruct
load_in_4bit: true
r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj]
per_device_batch: 1
grad_accum: 8
grad_checkpointing: true
max_seq_len: 2048
train_file: data/train.jsonl
